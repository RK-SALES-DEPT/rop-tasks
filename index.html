<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Задачи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --text:#1C1C1E; --muted:#6B6B70; --line:#EFEFEC; --line2:#E4E4E0;
  --ring:#B8B8BC; --accent:#3E6FA3; --accent-press:#2D557F; --warn:#B4532A;
  --d-tlm:#3E6FA3; --d-out:#C2702E; --d-in:#3C8A5C; --d-other:#7A6BB0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;color:var(--text);font-size:15px;line-height:20px;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:var(--tg-viewport-stable-height,100dvh);max-width:560px;margin:0 auto}

header{padding:18px 20px 8px;flex:none}
.date{font-size:13px;color:var(--muted)}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.5px}
.count{font-size:14px;font-weight:500;color:var(--accent);white-space:nowrap}
.bar{height:4px;border-radius:2px;background:var(--line2);margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:6px 0;color:var(--accent);font-size:15px;min-height:44px}

main{flex:1;overflow-y:auto;padding:12px 16px 16px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sec{display:flex;flex-direction:column;gap:6px}
.sec>h2{margin:0;padding-left:4px;font-size:12px;line-height:16px;font-weight:600;color:var(--muted)}
.sec>h2.warn{color:var(--warn)}
.card{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;padding:6px 6px 6px 4px;border-bottom:1px solid var(--line);transition:opacity .25s,transform .25s}
.row:last-child{border-bottom:0}
.row.leaving{opacity:0;transform:translateX(24px)}
.check{flex:none;width:44px;height:44px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.ring{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ring);display:flex;align-items:center;justify-content:center}
.ring.dash{border-style:dashed}
.ring.on{background:var(--accent);border-color:var(--accent)}
.body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:6px 8px 6px 0;display:flex;flex-direction:column;gap:2px;min-height:44px;justify-content:center}
.t{font-size:15px;line-height:20px;overflow-wrap:anywhere}
.done .t{color:var(--muted);text-decoration:line-through}
.m{font-size:12px;line-height:16px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.m .w{color:var(--warn)}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.bulb{width:44px;display:flex;justify-content:center;flex:none;color:var(--muted)}

.link{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface);border:0;width:100%;font-size:14px;text-align:left}
.link span{display:flex;align-items:center;gap:10px}
.ghost{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:transparent;font-size:14px;color:var(--muted);width:100%}
.ghost svg{transition:transform .2s}
.ghost.open svg{transform:rotate(180deg)}
.empty{padding:48px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:20px}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px;font-weight:600}
.hint{font-size:12px;color:var(--muted);padding:0 4px;line-height:16px}

.add{flex:none;padding:10px 16px;display:flex;gap:10px;align-items:center;background:var(--bg)}
.add input{flex:1;min-width:0;height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);font-size:15px;outline:none}
.add input:focus{border-color:var(--accent)}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);display:flex;align-items:center;justify-content:center}
.round:active{background:var(--accent-press)}
.round[disabled]{opacity:.6}

nav{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line2);background:var(--surface);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;justify-content:center;border:0;background:none;font-size:11px;font-weight:500;color:var(--muted);position:relative}
nav button.on{color:var(--accent);font-weight:600}
nav .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--line2);color:var(--text);font-size:10px;line-height:16px;font-weight:600}

.veil{position:fixed;inset:0;background:rgba(20,20,22,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;z-index:11;max-height:88vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px}
.sheet textarea{width:100%;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-family:inherit;font-size:16px;line-height:22px;resize:none;outline:none;color:var(--text);background:var(--surface)}
.sheet textarea:focus{border-color:var(--accent)}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);background:var(--surface);font-size:14px;display:inline-flex;align-items:center;gap:6px;position:relative}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .dot{background:#fff!important}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.person{width:100%;height:40px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;outline:none;background:var(--surface)}
.person:focus{border-color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;min-height:44px;border-radius:12px;border:0;background:var(--bg);font-size:15px;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--warn)}

.toast{position:fixed;left:16px;right:16px;bottom:calc(140px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:#1C1C1E;color:#fff;border-radius:12px;padding:10px 8px 10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast button{border:0;background:none;color:#9CC2EA;font-weight:600;min-height:32px;padding:0 8px}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-size:14px}
.err{margin:24px 4px;padding:14px;border-radius:12px;background:var(--surface);color:var(--muted);font-size:14px;line-height:20px}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <main id="main"><div class="loading">Загружаю задачи…</div></main>
  <form class="add" id="addForm" autocomplete="off">
    <input id="addInput" type="text" aria-label="Новая задача" placeholder="Новая задача… «отчёт пт #тлм»" enterkeyhint="send">
    <button class="round" id="addBtn" type="submit" aria-label="Добавить задачу">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>
  <nav id="nav">
    <button data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Сегодня</button>
    <button data-tab="week"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Неделя</button>
    <button data-tab="wait"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="18" cy="11" r="4"/><path d="M18 9.2v2l1.3.9"/></svg>Жду</button>
    <button data-tab="ideas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Идеи</button>
  </nav>
</div>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Задача"></div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastBtn" type="button"></button></div>

<script>
/* ===== Настройка: адрес развёрнутого Apps Script (…/exec) ===== */
const API = 'PASTE_WEBAPP_URL';

const tg = window.Telegram && window.Telegram.WebApp;
const INIT = tg && tg.initData || '';
const DEMO = !INIT && /[?&]demo/.test(location.search);

const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const WD_FULL = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const DIR_COLOR = {'ТЛМ':'var(--d-tlm)','Исходящие':'var(--d-out)','Входящие':'var(--d-in)'};

const S = { tasks: [], today: '', dirs: ['ТЛМ','Исходящие','Входящие'], tab: 'today', sub: null, showDone: false, loaded: false, error: '' };

/* ---------- даты ---------- */
const toD = s => new Date(Date.UTC(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10), 12));
const fromD = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d = toD(s); d.setUTCDate(d.getUTCDate()+n); return fromD(d); };
const nextDow = (s,w) => addDays(s, (w - toD(s).getUTCDay() + 7) % 7);
const diff = (a,b) => Math.round((toD(b)-toD(a))/864e5);
const short = s => s.slice(8,10)+'.'+s.slice(5,7);
const human = s => { const d = toD(s); return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]; };
function localToday(){ const f = new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit'}); return f.format(new Date()); }
function dueText(due){
  if(!due) return 'без срока';
  const n = diff(S.today, due);
  if(n < 0) return 'с '+short(due);
  if(n === 0) return 'сегодня';
  if(n === 1) return 'завтра';
  if(n < 7) return WD[toD(due).getUTCDay()]+', '+short(due);
  return short(due);
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n,a,b,c) => { const x=n%10, y=n%100; return x===1&&y!==11?a:(x>=2&&x<=4&&(y<12||y>14)?b:c); };

/* ---------- API ---------- */
let queue = Promise.resolve();
function call(action, payload){
  const run = () => DEMO ? demoCall(action, payload) :
    fetch(API, { method:'POST', body: JSON.stringify(Object.assign({ initData: INIT, action }, payload||{})) })
      .then(r => r.json());
  const p = queue.then(run).then(res => {
    if(!res.ok) throw new Error(res.error || 'error');
    S.tasks = res.tasks; S.today = res.today; if(res.dirs && res.dirs.length) S.dirs = res.dirs;
    S.loaded = true; S.error = '';
    return res;
  });
  queue = p.catch(()=>{});
  return p;
}
function fail(e){
  const auth = String(e && e.message) === 'auth';
  toast(auth ? 'Нет доступа — открой через своего бота' : 'Не получилось сохранить. Проверь интернет', '', null);
  call('list').then(render).catch(()=>{});
}

/* ---------- выборки ---------- */
const isOpen = t => t.status === 'active' || t.status === 'waiting';
const sel = {
  overdue: () => S.tasks.filter(t => isOpen(t) && t.due && t.due < S.today),
  today:   () => S.tasks.filter(t => isOpen(t) && t.due === S.today),
  done:    () => S.tasks.filter(t => t.status === 'done'),
  inbox:   () => S.tasks.filter(t => t.status === 'inbox'),
  wait:    () => S.tasks.filter(t => t.status === 'waiting'),
  ideas:   () => S.tasks.filter(t => t.status === 'idea'),
  future:  () => S.tasks.filter(t => isOpen(t) && t.due && t.due > S.today),
  nodate:  () => S.tasks.filter(t => t.status === 'active' && !t.due),
};
const byCreatedDesc = (a,b) => (b.created||'').localeCompare(a.created||'');

/* ---------- отрисовка ---------- */
const ICON_CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_CLOCK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const ICON_BULB = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>';
const CHEV_R = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
const CHEV_D = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

function metaHTML(t, opts){
  opts = opts || {};
  const parts = [];
  if(t.dir) parts.push('<span class="dot" style="background:'+(DIR_COLOR[t.dir]||'var(--d-other)')+'"></span>'+esc(t.dir));
  if(t.status === 'waiting' && !opts.noPerson) parts.push(ICON_CLOCK + (t.person ? esc(t.person)+', ' : '') + 'жду ' + Math.max(0, diff((t.created||S.today).slice(0,10), S.today)) + ' дн.');
  if(opts.due && t.status !== 'idea' && t.status !== 'done'){
    if(t.due && t.due < S.today) parts.push('<span class="w">'+dueText(t.due)+'</span>');
    else if(t.due || opts.showNoDate) parts.push(dueText(t.due));
  }
  if(!parts.length) return '';
  return '<span class="m">'+parts.join('<span aria-hidden="true">·</span>')+'</span>';
}

function rowHTML(t, opts){
  opts = opts || {};
  const done = t.status === 'done';
  const left = t.status === 'idea'
    ? '<span class="bulb">'+ICON_BULB+'</span>'
    : '<button class="check" data-act="toggle" data-id="'+t.id+'" aria-label="'+(done?'Вернуть в работу':'Отметить выполненной')+'"><span class="ring'+(done?' on':'')+(t.status==='waiting'&&!done?' dash':'')+'">'+(done?ICON_CHECK:'')+'</span></button>';
  return '<div class="row'+(done?' done':'')+'" id="r-'+t.id+'">'+left+
    '<button class="body" data-act="open" data-id="'+t.id+'"><span class="t">'+esc(t.title)+'</span>'+metaHTML(t, opts)+'</button></div>';
}

function section(title, list, opts, cls){
  if(!list.length) return '';
  return '<section class="sec"><h2'+(cls?' class="'+cls+'"':'')+'>'+esc(title)+' · '+list.length+'</h2><div class="card">'+list.map(t=>rowHTML(t,opts)).join('')+'</div></section>';
}

function emptyHTML(b, text){ return '<div class="empty"><b>'+esc(b)+'</b>'+esc(text)+'</div>'; }

function render(){
  const hdr = document.getElementById('hdr');
  const main = document.getElementById('main');
  document.querySelectorAll('#nav button').forEach(b => {
    b.classList.toggle('on', b.dataset.tab === S.tab && !S.sub);
    b.setAttribute('aria-current', b.dataset.tab === S.tab && !S.sub ? 'page' : 'false');
    const old = b.querySelector('.badge'); if(old) old.remove();
  });
  const waitN = sel.wait().length;
  if(waitN){ const wb = document.querySelector('#nav [data-tab=wait]'); wb.insertAdjacentHTML('beforeend','<span class="badge">'+waitN+'</span>'); }
  if(tg && tg.BackButton){ S.sub ? tg.BackButton.show() : tg.BackButton.hide(); }

  if(S.error){ hdr.innerHTML = '<div class="hrow"><h1>Задачи</h1></div>'; main.innerHTML = '<div class="err">'+esc(S.error)+'</div>'; return; }
  if(!S.loaded){ return; }

  let h = '', m = '';
  if(S.sub === 'inbox'){
    h = '<button class="back" data-act="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>Сегодня</button><div class="hrow"><h1>Входящие</h1></div>';
    const list = sel.inbox().sort(byCreatedDesc);
    m = list.length ? '<p class="hint">Нажми на задачу, чтобы поставить срок или направление.</p><div class="card">'+list.map(t=>rowHTML(t)).join('')+'</div>'
                    : emptyHTML('Всё разобрано', 'Новые задачи без срока и направления появятся здесь.');
  }
  else if(S.tab === 'today'){
    const over = sel.overdue(), tod = sel.today(), dn = sel.done(), inb = sel.inbox();
    const total = over.length + tod.length + dn.length;
    const pct = total ? Math.round(dn.length/total*100) : 0;
    h = '<div class="date">'+WD_FULL[toD(S.today).getUTCDay()]+', '+human(S.today)+'</div>'+
        '<div class="hrow"><h1>Сегодня</h1>'+(total?'<span class="count">'+dn.length+' из '+total+'</span>':'')+'</div>'+
        (total?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'');
    if(inb.length) m += '<button class="link" data-act="inbox"><span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>Входящие — '+inb.length+' '+plural(inb.length,'неразобранная','неразобранных','неразобранных')+'</span>'+CHEV_R+'</button>';
    m += section('Просрочено', over, {due:true}, 'warn');
    m += section('На сегодня', tod, {});
    if(!over.length && !tod.length) m += emptyHTML(dn.length ? 'На сегодня всё' : 'Пока пусто', dn.length ? 'Можно выдохнуть или заглянуть в «Неделю».' : 'Напиши задачу внизу или просто сообщением боту.');
    if(dn.length){
      m += '<button class="ghost'+(S.showDone?' open':'')+'" data-act="showdone" aria-expanded="'+S.showDone+'"><span>Выполнено сегодня · '+dn.length+'</span>'+CHEV_D+'</button>';
      if(S.showDone) m += '<div class="card">'+dn.map(t=>rowHTML(t)).join('')+'</div>';
    }
  }
  else if(S.tab === 'week'){
    h = '<div class="hrow"><h1>Неделя</h1></div>';
    const fut = sel.future().sort((a,b)=>a.due.localeCompare(b.due));
    const limit = addDays(S.today, 7);
    const days = {};
    fut.filter(t=>t.due<=limit).forEach(t => (days[t.due] = days[t.due] || []).push(t));
    Object.keys(days).sort().forEach(d => {
      const n = diff(S.today, d);
      const title = n===1 ? 'Завтра, '+human(d) : WD_FULL[toD(d).getUTCDay()]+', '+human(d);
      m += section(title, days[d], {});
    });
    m += section('Позже', fut.filter(t=>t.due>limit), {due:true});
    m += section('Без срока', sel.nodate().sort(byCreatedDesc), {});
    if(!m) m = emptyHTML('Неделя свободна', 'Задачи со сроком после сегодняшнего дня появятся здесь.');
  }
  else if(S.tab === 'wait'){
    h = '<div class="hrow"><h1>Жду</h1></div>';
    const groups = {};
    sel.wait().sort((a,b)=>(a.created||'').localeCompare(b.created||'')).forEach(t => (groups[t.person||'Без имени'] = groups[t.person||'Без имени'] || []).push(t));
    Object.keys(groups).sort().forEach(p => m += section(p, groups[p], {due:true, noPerson:false}));
    m = m ? '<p class="hint">Кружок — «ответ получен».</p>' + m : emptyHTML('Никого не ждёшь', 'Поручения с @именем попадут сюда, например «@Арина отчёт по KPI пт».');
  }
  else if(S.tab === 'ideas'){
    h = '<div class="hrow"><h1>Идеи</h1></div>';
    const list = sel.ideas().sort(byCreatedDesc);
    m = list.length ? '<div class="card">'+list.map(t=>rowHTML(t)).join('')+'</div><p class="hint">Нажми на идею, чтобы превратить её в задачу.</p>'
                    : emptyHTML('Копилка пуста', 'Начни сообщение со слова «идея», и оно попадёт сюда.');
  }
  hdr.innerHTML = h;
  main.innerHTML = m;
}

/* ---------- действия ---------- */
function find(id){ return S.tasks.find(t => t.id === id); }
function haptic(kind){ try{ if(!tg||!tg.HapticFeedback) return; kind==='ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred('light'); }catch(e){} }

function update(id, fields, opts){
  const t = find(id); if(!t) return;
  Object.assign(t, fields);
  if(!('status' in fields)){
    if((t.status==='inbox'||t.status==='idea') && fields.due) t.status = t.person ? 'waiting' : 'active';
    else if(t.status==='inbox' && fields.dir) t.status = 'active';
  }
  if(t.status==='idea') t.due = '';
  if(!(opts && opts.silent)) render();
  return call('update', { id, fields }).then(render).catch(fail);
}

function toggle(id){
  const t = find(id); if(!t) return;
  if(t.status === 'done'){
    const back = t.person ? 'waiting' : (t.due || t.dir ? 'active' : 'inbox');
    haptic(); update(id, { status: back });
    return;
  }
  const prev = t.status;
  haptic('ok');
  const row = document.getElementById('r-'+id);
  if(row) row.classList.add('leaving');
  setTimeout(() => {
    update(id, { status:'done' });
    toast('Готово: '+t.title, 'Отменить', () => update(id, { status: prev }));
  }, 220);
}

/* ---------- шторка задачи ---------- */
let openId = null;
function chip(label, act, val, on, dot){
  return '<button type="button" class="chip'+(on?' on':'')+'" data-act="'+act+'" data-val="'+esc(val)+'">'+(dot?'<span class="dot" style="background:'+dot+'"></span>':'')+esc(label)+'</button>';
}
function openSheet(id){
  const t = find(id); if(!t) return;
  openId = id;
  const fri = nextDow(S.today,5), mon0 = nextDow(S.today,1), mon = mon0===S.today?addDays(S.today,7):mon0, tom = addDays(S.today,1);
  const known = [S.today, tom, fri, mon];
  const custom = t.due && known.indexOf(t.due) < 0;
  const isIdea = t.status === 'idea';
  let html = '<div class="grab"></div>'+
    '<textarea id="sTitle" rows="2" aria-label="Название задачи">'+esc(t.title)+'</textarea>';
  if(!isIdea){
    html += '<div class="lbl">Срок</div><div class="chips">'+
      chip('Сегодня','due',S.today,t.due===S.today)+
      chip('Завтра','due',tom,t.due===tom)+
      (fri!==S.today&&fri!==tom?chip('Пт, '+short(fri),'due',fri,t.due===fri):'')+
      chip('Пн, '+short(mon),'due',mon,t.due===mon)+
      '<label class="chip'+(custom?' on':'')+'">'+(custom?short(t.due):'Дата…')+'<input type="date" id="sDate" value="'+(t.due||'')+'" aria-label="Выбрать дату"></label>'+
      chip('Без срока','due','',!t.due)+
    '</div>';
  }
  html += '<div class="lbl">Направление</div><div class="chips">'+
    S.dirs.map(d => chip(d,'dir',d,t.dir===d,DIR_COLOR[d]||'var(--d-other)')).join('')+
    chip('Нет','dir','',!t.dir)+'</div>';
  if(!isIdea){
    html += '<div class="lbl">Жду от кого</div><input class="person" id="sPerson" type="text" placeholder="Имя — если поручила" value="'+esc(t.person||'')+'" aria-label="Жду от кого">';
  }
  html += '<div class="acts">'+
    (isIdea ? '<button class="btn primary" data-act="ideaToTask">Сделать задачей на сегодня</button>'
            : '<button class="btn" data-act="toIdea">В идеи</button>')+
    '<button class="btn danger" data-act="del">Удалить</button></div>'+
    '<div class="acts" style="margin-top:8px"><button class="btn primary" data-act="close">Готово</button></div>';
  const sh = document.getElementById('sheet');
  sh.innerHTML = html;
  sh.classList.add('on'); document.getElementById('veil').classList.add('on');
  if(tg && tg.BackButton) tg.BackButton.show();
  const di = document.getElementById('sDate');
  if(di) di.addEventListener('change', e => { if(e.target.value){ update(openId, { due: e.target.value }); openSheet(openId); } });
}
function closeSheet(){
  if(!openId){ return; }
  const t = find(openId);
  const ti = document.getElementById('sTitle'), pi = document.getElementById('sPerson');
  if(t){
    const f = {};
    const nt = ti && ti.value.trim();
    if(nt && nt !== t.title) f.title = nt;
    if(pi){
      const np = pi.value.trim().replace(/^@/,'');
      if(np !== (t.person||'')){
        f.person = np;
        if(np && (t.status==='active'||t.status==='inbox')) f.status = 'waiting';
        if(!np && t.status==='waiting') f.status = t.due||t.dir ? 'active' : 'inbox';
      }
    }
    if(Object.keys(f).length) update(openId, f);
  }
  openId = null;
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('veil').classList.remove('on');
  if(tg && tg.BackButton && !S.sub) tg.BackButton.hide();
}

/* ---------- тост ---------- */
let toastTimer;
function toast(text, btn, fn){
  const el = document.getElementById('toast'), b = document.getElementById('toastBtn');
  document.getElementById('toastText').textContent = text;
  b.textContent = btn || ''; b.style.display = btn ? '' : 'none';
  b.onclick = () => { el.classList.remove('on'); if(fn) fn(); };
  el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), btn ? 4500 : 2600);
}

/* ---------- события ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if(a === 'toggle') toggle(id);
  else if(a === 'open') openSheet(id);
  else if(a === 'inbox'){ S.sub = 'inbox'; render(); }
  else if(a === 'back'){ S.sub = null; render(); }
  else if(a === 'showdone'){ S.showDone = !S.showDone; render(); }
  else if(a === 'due'){ update(openId, { due: el.dataset.val }); openSheet(openId); }
  else if(a === 'dir'){ update(openId, { dir: el.dataset.val }); openSheet(openId); }
  else if(a === 'toIdea'){ const id2 = openId; closeSheet(); update(id2, { status:'idea', due:'' }); toast('Перенесла в идеи'); }
  else if(a === 'ideaToTask'){ const id2 = openId; closeSheet(); update(id2, { status:'active', due:S.today }); toast('Задача на сегодня'); }
  else if(a === 'del'){
    const id2 = openId, t = find(id2); closeSheet();
    S.tasks = S.tasks.filter(x => x.id !== id2); render();
    call('delete', { id: id2 }).then(render).catch(fail);
    toast('Удалено: '+(t?t.title:''));
  }
  else if(a === 'close') closeSheet();
});
document.getElementById('veil').addEventListener('click', closeSheet);
document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => {
  closeSheet(); S.tab = b.dataset.tab; S.sub = null; haptic(); render(); document.getElementById('main').scrollTop = 0;
}));
document.getElementById('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const inp = document.getElementById('addInput'), btn = document.getElementById('addBtn');
  const text = inp.value.trim(); if(!text) return;
  btn.disabled = true;
  call('add', { text }).then(res => {
    inp.value = ''; haptic('ok'); render();
    toast('✓ '+res.added.title+' — '+res.label);
  }).catch(fail).finally(() => { btn.disabled = false; });
});
if(tg && tg.BackButton) tg.BackButton.onClick(() => { if(openId) closeSheet(); else if(S.sub){ S.sub = null; render(); } });

/* ---------- старт ---------- */
if(tg){
  try{
    tg.ready(); tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#F4F4F1');
    tg.setBackgroundColor && tg.setBackgroundColor('#F4F4F1');
    tg.setBottomBarColor && tg.setBottomBarColor('#FFFFFF');
    tg.disableVerticalSwipes && tg.disableVerticalSwipes();
  }catch(e){}
}
S.today = localToday();
if(!INIT && !DEMO){
  S.error = 'Открой это приложение через своего бота в Telegram — кнопка «Задачи» слева от поля ввода.';
  render();
} else {
  call('list').then(render).catch(e => {
    S.error = String(e && e.message) === 'auth' ? 'Это личное приложение, у тебя нет к нему доступа.' : 'Не удалось загрузить задачи. Проверь интернет и открой ещё раз.';
    render();
  });
}

/* ---------- демо-режим (?demo=1) для просмотра без Telegram ---------- */
function demoCall(action, p){
  const today = localToday();
  if(!window.__demo){
    const c = d => d+' 10:00';
    window.__demo = [
      {id:'a1',created:c(addDays(today,-3)),title:'Согласовать скрипт для холодной базы',dir:'Исходящие',person:'',due:addDays(today,-1),status:'active',doneAt:''},
      {id:'a2',created:c(today),title:'Отчёт по дозвону за октябрь',dir:'ТЛМ',person:'',due:today,status:'active',doneAt:''},
      {id:'a3',created:c(today),title:'Разбор звонков новых менеджеров',dir:'ТЛМ',person:'',due:today,status:'active',doneAt:''},
      {id:'a4',created:c(today),title:'Проверить заявки с Банки.ру',dir:'Входящие',person:'',due:today,status:'active',doneAt:''},
      {id:'a5',created:c(addDays(today,-3)),title:'Предложения по KPI',dir:'Входящие',person:'Арина',due:today,status:'waiting',doneAt:''},
      {id:'a6',created:c(today),title:'Планёрка ТЛМ: итоги недели',dir:'ТЛМ',person:'',due:nextDow(addDays(today,1),5),status:'active',doneAt:''},
      {id:'a7',created:c(today),title:'Позвонить юристам',dir:'',person:'',due:'',status:'inbox',doneAt:''},
      {id:'a8',created:c(today),title:'Чек-лист для новичков на первую неделю',dir:'ТЛМ',person:'',due:'',status:'idea',doneAt:''},
      {id:'a9',created:c(today),title:'Выгрузить звонки из Mango',dir:'ТЛМ',person:'',due:today,status:'done',doneAt:c(today)},
    ];
  }
  const D = window.__demo;
  let extra = {};
  if(action==='add'){ const t={id:'n'+Date.now(),created:today+' 12:00',title:p.text,dir:'',person:'',due:'',status:'inbox',doneAt:''}; D.unshift(t); extra={added:t,label:'входящие'}; }
  if(action==='update'){ const t=D.find(x=>x.id===p.id); if(t) Object.assign(t,p.fields); }
  if(action==='delete'){ const i=D.findIndex(x=>x.id===p.id); if(i>=0) D.splice(i,1); }
  return new Promise(r => setTimeout(() => r(Object.assign({ok:true,today,dirs:['ТЛМ','Исходящие','Входящие'],tasks:D.map(x=>Object.assign({},x))},extra)), 200));
}
